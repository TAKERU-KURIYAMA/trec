name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'Common.Shared/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'Common.Shared/**'

env:
  DOTNET_VERSION: '8.0'
  DEPLOYMENT_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore api/Api.sln

      - name: Build solution
        run: dotnet build api/Api.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test api.Tests/api.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: api.Tests/TestResults/

  build:
    name: Build API
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore api/Api.sln

      - name: Build and publish
        run: |
          dotnet publish api/Api.csproj \
            --configuration Release \
            --output ./publish \
            --no-restore \
            --self-contained false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./publish/
          retention-days: 1

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: ./publish/

      # Docker デプロイの場合
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_USERNAME }}
          password: ${{ secrets.CONTAINER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.CONTAINER_REGISTRY }}/message-api:latest
            ${{ secrets.CONTAINER_REGISTRY }}/message-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # データベースマイグレーション
      - name: Run database migrations
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/message
            # バックアップを作成
            docker-compose exec -T postgres pg_dump -U postgres message > backup_$(date +%Y%m%d_%H%M%S).sql
            
            # マイグレーション実行
            docker-compose run --rm api dotnet ef database update --connection "${{ secrets.DATABASE_CONNECTION_STRING }}"

      # サーバーへのデプロイ
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/message
            docker-compose pull api
            docker-compose up -d api
            docker image prune -f

      # ヘルスチェック
      - name: Health check
        run: |
          sleep 30
          curl -f ${{ secrets.API_URL }}/health || exit 1

      # Rollback on failure
      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/message
            echo "Deployment failed, rolling back..."
            docker-compose down api
            docker tag ${{ secrets.CONTAINER_REGISTRY }}/message-api:stable ${{ secrets.CONTAINER_REGISTRY }}/message-api:latest
            docker-compose up -d api

      # 通知
      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: '🚀 API deployment successful!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#deployments'
          text: '❌ API deployment failed and rolled back!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}