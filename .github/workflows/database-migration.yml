name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      migration_type:
        description: 'Migration type'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - rollback
      backup:
        description: 'Create backup before migration'
        required: true
        default: true
        type: boolean

env:
  DOTNET_VERSION: '8.0'

jobs:
  validate-migration:
    name: Validate Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Validate migration scripts
        run: |
          cd api
          dotnet ef migrations list
          dotnet ef database update --dry-run

  backup-database:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: validate-migration
    if: inputs.backup == true
    environment: ${{ inputs.environment }}

    steps:
      - name: Create database backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            BACKUP_FILE="message_backup_$(date +%Y%m%d_%H%M%S).sql"
            echo "Creating backup: $BACKUP_FILE"
            
            docker-compose exec -T postgres pg_dump \
              -U postgres \
              -h localhost \
              -d message_${{ inputs.environment }} \
              > /opt/backups/$BACKUP_FILE
            
            # Verify backup
            if [ -f "/opt/backups/$BACKUP_FILE" ]; then
              echo "Backup created successfully: $BACKUP_FILE"
              echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
            else
              echo "Backup creation failed"
              exit 1
            fi

      - name: Upload backup to S3 (optional)
        if: success()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Store backup in S3
        if: success()
        run: |
          aws s3 cp /opt/backups/${{ env.BACKUP_FILE }} \
            s3://${{ secrets.BACKUP_BUCKET }}/database-backups/${{ inputs.environment }}/

  run-migration:
    name: Run Database Migration
    runs-on: ubuntu-latest
    needs: [validate-migration, backup-database]
    if: always() && (needs.backup-database.result == 'success' || inputs.backup == false)
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Run database migration
        if: inputs.migration_type == 'update'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/message
            
            echo "Running database migration..."
            docker-compose run --rm api dotnet ef database update \
              --connection "${{ secrets.DATABASE_CONNECTION_STRING }}"
            
            echo "Migration completed successfully"

      - name: Rollback database migration
        if: inputs.migration_type == 'rollback'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/message
            
            echo "Rolling back database migration..."
            # Get the previous migration name (this would need to be determined)
            PREVIOUS_MIGRATION=$(docker-compose run --rm api dotnet ef migrations list | tail -n 2 | head -n 1)
            
            docker-compose run --rm api dotnet ef database update $PREVIOUS_MIGRATION \
              --connection "${{ secrets.DATABASE_CONNECTION_STRING }}"
            
            echo "Rollback completed successfully"

  verify-migration:
    name: Verify Migration
    runs-on: ubuntu-latest
    needs: run-migration

    steps:
      - name: Verify database integrity
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/message
            
            # Run database integrity checks
            docker-compose exec -T postgres psql \
              -U postgres \
              -d message_${{ inputs.environment }} \
              -c "SELECT 'Database connection OK' as status;"
            
            # Run application health check
            docker-compose exec -T api curl -f http://localhost:5000/health || exit 1
            
            echo "Database migration verified successfully"

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [run-migration, verify-migration]
    if: always()

    steps:
      - name: Cleanup old backups
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Keep only the last 10 backups
            cd /opt/backups
            ls -t message_backup_*.sql | tail -n +11 | xargs -r rm

  notify:
    name: Notify Migration Result
    runs-on: ubuntu-latest
    needs: [backup-database, run-migration, verify-migration]
    if: always()

    steps:
      - name: Notify success
        if: needs.run-migration.result == 'success' && needs.verify-migration.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#database'
          text: |
            ✅ Database migration completed successfully!
            Environment: ${{ inputs.environment }}
            Type: ${{ inputs.migration_type }}
            Backup created: ${{ inputs.backup }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: needs.run-migration.result == 'failure' || needs.verify-migration.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#database'
          text: |
            ❌ Database migration failed!
            Environment: ${{ inputs.environment }}
            Type: ${{ inputs.migration_type }}
            Migration: ${{ needs.run-migration.result }}
            Verification: ${{ needs.verify-migration.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}