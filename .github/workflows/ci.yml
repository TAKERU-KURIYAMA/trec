name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  DOTNET_VERSION: '8.0'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      api: ${{ steps.changes.outputs.api }}
      mobile: ${{ steps.changes.outputs.mobile }}
      common: ${{ steps.changes.outputs.common }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            api:
              - 'api/**'
            mobile:
              - 'mobile-app/**'
            common:
              - 'Common.Shared/**'

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.mobile == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Frontend linting
      - name: Lint Frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run typecheck

      # Mobile app linting
      - name: Lint Mobile App
        if: needs.changes.outputs.mobile == 'true'
        run: |
          cd mobile-app/TrecPlans
          npm ci
          npm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Generate test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./frontend/coverage
          flags: frontend

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.common == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: message_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore api/Api.sln

      - name: Build solution
        run: dotnet build api/Api.sln --no-restore --configuration Release

      - name: Run tests
        run: |
          dotnet test api.Tests/api.Tests.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=message_test;Username=postgres;Password=test_password

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./api.Tests/TestResults
          flags: api

  test-mobile:
    name: Test Mobile App
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: ./mobile-app/TrecPlans

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'mobile-app/TrecPlans/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: TypeScript check
        run: npx tsc --noEmit

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      # Dependency scanning
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        if: github.event_name == 'pull_request'

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test-frontend, test-api, test-mobile]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.test-frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.test-api.result }}" == "failure" ]] || \
             [[ "${{ needs.test-mobile.result }}" == "failure" ]]; then
            echo "One or more builds failed"
            exit 1
          else
            echo "All builds passed or were skipped"
          fi

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-frontend, test-api, test-mobile, security-scan]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Notify success
        if: needs.test-frontend.result == 'success' && needs.test-api.result == 'success' && needs.test-mobile.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#ci-cd'
          text: '✅ All CI checks passed for main branch!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: needs.test-frontend.result == 'failure' || needs.test-api.result == 'failure' || needs.test-mobile.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#ci-cd'
          text: |
            ❌ CI checks failed for main branch!
            Frontend: ${{ needs.test-frontend.result }}
            API: ${{ needs.test-api.result }}
            Mobile: ${{ needs.test-mobile.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}